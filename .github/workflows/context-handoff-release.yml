name: Verify context handoff; publish ZIP only on explicit request

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish an immutable SHA-matched context prerelease (milestone/manual handoff)"
        required: true
        type: boolean
        default: false

# Normal pushes only need READ permission. Publication is a separate,
# explicitly requested job, never a prerequisite for verifying the source.
permissions:
  contents: read

concurrency:
  group: context-handoff-${{ github.ref }}-${{ github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify-handoff:
    name: Verify full context contract at exact SHA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact pushed/dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current branch and SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Verified $GITHUB_REF_NAME @ $GITHUB_SHA"

      - name: Enforce unchanged 386-line specification and updated 17-section handoff
        env:
          HANDOFF_BEFORE: ${{ github.event.before }}
        run: |
          python3 tools/verify_context_handoff_contract.py --before "$HANDOFF_BEFORE" --head "$GITHUB_SHA"

      - name: Test handoff workflow invariants and no-Release resume
        run: python3 tools/test_context_handoff_process.py

      - name: Check S14.3 guard verifier and pure C host regression
        run: |
          if [ -f tools/verify_m8_s143_faststart.py ]; then
            python3 tools/verify_m8_s143_faststart.py
          fi

      - name: Check S14.2 and S14.5 capped steering tests (GCC)
        run: |
          if [ -f tools/verify_m8_s142_speed.py ]; then
            python3 tools/verify_m8_s142_speed.py
          fi

      - name: Test opt-in S14.7 two-axis AS5600 velocity PI
        run: python3 tools/verify_m8_s147_velocity_pi.py

      - name: Test M8-S14.8 Level2 default and non-additive PI/P+D hybrid
        run: python3 tools/verify_m8_s148_level2_hybrid.py

      - name: Test M8-S14.9 bounded terminal anticipation and no-motor host guards
        run: python3 tools/verify_m8_s149_terminal_lead.py

      - name: Test M8-S14.10 read-only terminal velocity shadow regression
        run: python3 tools/verify_m8_s1410_right_terminal_shadow.py

      - name: Test M8-S15 dual independent targets one common clock
        run: python3 tools/verify_m8_s15_common_time.py

      - name: Test M8-S15.1 passive stroke telemetry and inactive RIGHT ceiling
        run: python3 tools/verify_m8_s151_trace.py

      - name: Verify S15.2 passive manual angular-relation shadow
        run: python3 tools/verify_m8_s152_manual_relation.py

      - name: Verify RIGHT R_MIN 195 and SOFT 245 geometry/config guard
        run: python3 tools/verify_m8_right_min_geometry.py

      - name: Verify D-pad/RX NC outward held-command HOST regression
        run: python3 tools/verify_m8_manual_nc_escape.py

      - name: Verify PS2 16-key layout and passive 32-bit packet mirrors (actual C HOST)
        run: python3 tools/verify_ps2_button_layout.py

      - name: Verify VC-02 I1 UART decoder and independent SOFT/NC route kernels (actual C HOST)
        run: python3 tools/verify_m8_vc02_i1.py

      - name: Verify VC-02 I1 compiled main.c command builder (actual C HOST)
        run: python3 tools/verify_m8_vc02_command_core.py

      - name: Verify Voice 45 reaches both expected physical NC, not RAW-only (actual C HOST)
        run: python3 tools/verify_m8_vc02_45_nc.py

      - name: Verify S15.4 Voice dual AS5600 progress and speed coordinator (actual C HOST)
        run: python3 tools/verify_m8_s154_voice_sync.py

      - name: Verify S15.4 passive Voice RIGHT fine snapshot and safe UART
        run: python3 tools/verify_m8_s154_right_fine_diag.py

      - name: Verify VC-02 I1 real C wheel/steering executor safety state machine
        run: python3 tools/verify_m8_vc02_executor.py

      - name: Verify FF soft brake and PS2 emergency takeover with actual C HOST
        run: python3 tools/verify_m8_vc02_stop_swap.py

      - name: Verify guarded automatic ARM and sensor recovery without START (actual C HOST)
        run: python3 tools/verify_m8_vc02_auto_arm.py

      - name: Verify S15.3 far-zone candidate actual C HOST and baseline guards
        run: python3 tools/verify_m8_s153_far_trim.py

      - name: Verify S15.3 RIGHT trim isolation source and STOP guards
        run: python3 tools/verify_m8_s153_trim_ab.py

      - name: Verify passive S15.3D STALL/STOP5 snapshot and portable C regression
        run: python3 tools/verify_m8_s153_stall_diag.py

      - name: Verify S15.3 RIGHT-only opt-in bounded owner and C HOST regression
        run: python3 tools/verify_m8_s153_right_only.py

      - name: Verify embedded firmware Git identity and fail-closed UART capture
        run: python3 tools/verify_firmware_build_identity.py

      - name: Verify S15.2 four-run PowerShell-only UART capture
        run: python3 tools/verify_m8_s152_capture.py

      - name: Validate passive RIGHT low-PWM A/B analyzer
        run: python3 tools/analyze_m8_right_low_pwm.py --self-test

  validate-s152-powershell:
    name: Validate native Windows PowerShell capture syntax
    runs-on: windows-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Parse serial capture and Git stamping scripts without serial hardware
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @(".\\tools\\capture_m8_s152.ps1",
                               ".\\tools\\capture_m8_s154_right_fine.ps1",
                               ".\\tools\\stamp_firmware_build.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: PowerShell 5.1 syntax verified at exact commit."

      - name: Generate Git-stamped C header on Windows and check exact SHA/clean
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\\tools\\stamp_firmware_build.ps1
          if ($LASTEXITCODE -ne 0) { throw "Firmware stamping failed" }
          $head = (git rev-parse HEAD).Trim()
          $content = [IO.File]::ReadAllText(".\\Core\\Inc\\firmware_build_id_generated.h")
          if (-not $content.Contains('#define FW_BUILD_GIT_SHA "' + $head + '"')) {
            throw "Wrong Git commit embedded in generated firmware header"
          }
          if (-not $content.Contains('#define FW_BUILD_GIT_DIRTY 0U')) {
            throw "Clean checkout improperly marked dirty"
          }
          Write-Host "PASS: Generated header contains exact checkout SHA, clean."

  publish-release:
    name: Optional milestone / offline context package
    # A push NEVER publishes. A manual run with the boolean checked does,
    # and only after the same exact SHA passed all required checks.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    needs: verify-handoff
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact SHA after successful verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert checkout SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build optional SHA-grounded context bundle
        run: python3 tools/build_context_release.py --output dist/context-release

      - name: Publish SHA-bound prerelease (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="context-${GITHUB_SHA}"
          short="${GITHUB_SHA:0:12}"
          bundle="dist/context-release/context-handoff-${short}.zip"
          status="dist/context-release/RELEASE_STATUS.md"
          if gh release view "${tag}" >/dev/null 2>&1; then
            # Idempotent WITHOUT mutating historical assets or tags.
            # If this tag predates the new process, preserve it exactly.
            echo "Context release ${tag} already exists; preserving prior assets."
          else
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "Context handoff | ${GITHUB_REF_NAME} | ${short}" \
              --notes-file "${status}" \
              --prerelease \
              --latest=false \
              "${bundle}" "${status}"
          fi
